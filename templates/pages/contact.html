{% extends 'base.html' %}
{% block title %}お問い合わせ — Booth Clone{% endblock %}

{% block content %}
<div class="page">
    <div class="page-header">
        <h1 class="page-title">お問い合わせ</h1>
        <p class="page-subtitle">ご質問・ご要望は以下のフォームからお送りください。</p>
    </div>

    <div class="page-section">
        <form method="post" class="contact-form" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p style="color:var(--danger);font-size:.85rem;margin:4px 0 0;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">送信する</button>
        </form>
    </div>
</div>
{% endblock %}
