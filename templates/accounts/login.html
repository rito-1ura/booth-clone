{% extends 'base.html' %}
{% load static %}
{% block title %}ログイン — Booth Clone{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">ログイン</h1>

        <form method="POST">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <ul class="errorlist">
                {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
            {% endif %}

            <div class="form-group">
                <label for="id_login">メールアドレス</label>
                <input type="email" name="username" id="id_login" class="form-input" placeholder="example@email.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">パスワード</label>
                <input type="password" name="password" id="id_password" class="form-input" placeholder="パスワード" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">ログイン</button>
        </form>

        <p class="auth-link">
            アカウントをお持ちでない方は <a href="{% url 'accounts:signup' %}">新規登録</a>
        </p>
    </div>
</div>
{% endblock %}
